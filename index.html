<!DOCTYPE html>
<html lang="es" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oposiciones · Seguimiento de tests</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Cpath d='M32 18c-5-3-12-4-20-3v31c8-1 15 0 20 3 5-3 12-4 20-3V15c-8-1-15 0-20 3z' fill='%23fff'/%3E%3Cpath d='M32 18v31' stroke='%234f46e5' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--bg:#f5f6fb;--cd:#fff;--tx:#1d2233;--mu:#6c748a;--bd:#e2e5ef;--ac:#4f46e5;--hd:#eceffa;--bk:#e4e8fb;--sh:0 8px 30px rgba(30,40,90,.15);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12141c;--cd:#1b1f2b;--tx:#e8eaf3;--mu:#9aa3ba;--bd:#2b3142;--ac:#8b93ff;--hd:#232838;--bk:#262c45;--sh:0 8px 30px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12141c;--cd:#1b1f2b;--tx:#e8eaf3;--mu:#9aa3ba;--bd:#2b3142;--ac:#8b93ff;--hd:#232838;--bk:#262c45;--sh:0 8px 30px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:22px 0 8px}h2 .gl{cursor:pointer}h2 .gl:hover{color:var(--ac);text-decoration:underline}.sub{color:var(--mu);margin:0 0 14px;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;padding:7px 12px;transition:.15s}
button:hover{border-color:var(--ac);color:var(--ac)}
button.pr{background:var(--ac);color:#fff;border-color:var(--ac)}button.pr:hover{color:#fff;opacity:.9}
button.dg:hover{border-color:#ef4444;color:#ef4444}
.wrap{overflow-x:auto;background:var(--cd);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh)}
.wrap::-webkit-scrollbar{height:10px}.wrap::-webkit-scrollbar-track{background:transparent;margin:0 14px}.wrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:10px;border:2px solid var(--cd)}.wrap::-webkit-scrollbar-thumb:hover{background:var(--ac)}
@supports not selector(::-webkit-scrollbar){.wrap{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}}
.cx{cursor:pointer;margin-left:6px;opacity:.4}.cx:hover{opacity:1;color:#ef4444}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
th{background:var(--hd);font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--mu)}
.l{text-align:left}td.l{min-width:200px}
th.add button{padding:2px 10px;font-size:16px;border-radius:8px}
tr.blk td{background:var(--bk);font-weight:600}
.nm{cursor:pointer}.nm:hover{color:var(--ac);text-decoration:underline}
tr:not(.blk) td.l{padding-left:26px}
.ic{opacity:0;cursor:pointer;margin-left:7px;color:var(--mu);font-size:13px}
tr:hover .ic{opacity:1}.ic:hover{color:var(--ac)}
@media (hover:none){.ic{opacity:.6}}
td.sc{cursor:pointer;min-width:90px}td.sc:hover{background:var(--hd)}td.sc i{color:var(--mu);font-style:normal}
td.p{font-weight:600;min-width:64px}
.c{background:#7dd3fc;color:#0c3a52}.g{background:#86efac;color:#14532d}.y{background:#fde047;color:#5a4500}.r{background:#fca5a5;color:#6b1111}
.tc.c,.tc.g,.tc.y,.tc.r{background:var(--bk)}.tc.c{color:#0ea5e9}.tc.g{color:#16a34a}.tc.y{color:#d19a00}.tc.r{color:#ef4444}
.empty{padding:34px;text-align:center;color:var(--mu)}
#ov{position:fixed;inset:0;background:rgba(10,12,25,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#md{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--sh)}
#md h3{margin:0 0 12px}
.ans{padding:9px 12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;background:var(--bg)}.ans.ok{background:#86efac;color:#14532d;border-color:#22c55e}.ans.ko{background:#fca5a5;color:#6b1111;border-color:#ef4444}
.mq{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--bg)}.mq .qt{font-weight:600;margin:4px 0;white-space:pre-wrap}.mq .bt{margin-top:8px}
#md.wd{max-width:780px}#md.wd .qh{margin-bottom:18px}#md.wd .ql{margin-bottom:8px}#md.wd .tx{margin-bottom:22px}#md.wd h3{margin:0 0 22px;line-height:1.4}
input[type=text],textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
textarea{min-height:70px;resize:vertical;margin-bottom:8px}
.ar{display:flex;gap:8px;align-items:center;margin-bottom:8px}.ar input[type=radio]{accent-color:var(--ac);width:20px;height:20px}
.bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mu{color:var(--mu);font-size:13px}
.tx{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px;max-height:34vh;overflow:auto}
.op{display:block;width:100%;text-align:left;margin-bottom:8px;padding:11px 13px;white-space:normal}
.op.ok{background:#86efac;color:#14532d;border-color:#22c55e}.op.ko{background:#fca5a5;color:#6b1111;border-color:#ef4444}
#pop{position:fixed;display:none;z-index:40;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;box-shadow:var(--sh);width:230px}
#pop button{width:100%;margin-top:7px;text-align:left}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:10px;display:none;z-index:60;font-size:14px}
</style></head><body>
<h1>📚 Seguimiento de tests</h1>
<p class="sub">Clic en una casilla para editar o gestionar errores · clic en un tema o bloque para repasar errores.</p>
<div class="bar">
<button class="pr" onclick="addB()">＋ Bloque</button>
<button onclick="expCSV()">⬇ Exportar CSV</button>
<button onclick="document.getElementById('fl').click()">📂 Cargar</button>
<button class="dg" onclick="clearAll()">🗑 Borrar todo</button>
<button id="un" onclick="undo()">↩ Deshacer</button>
<input type="file" id="fl" accept=".json,.csv,.txt" hidden>
</div>
<div id="tb"></div>
<div id="pop"></div><div id="ov"><div id="md"></div></div><div id="toast"></div>
<script>
var K='opos_v1',S,CB,R,DL=null;
function norm(){S.n=S.n||1;S.np=S.np||1;S.blocks.forEach(function(b){b.h=b.h||{};b.topics.forEach(function(t){t.s=t.s||[];t.p=t.p||[];t.q=t.q||[];t.h=t.h||{}})})}
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.blocks)S={n:1,np:1,blocks:[]};norm()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9)}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function KY(m){return m==='T'?'s':'p'}function NN(m){return m==='T'?S.n:S.np}function LB(m){return m==='T'?'Test':'Prueba'}
function parse(v){var m=/^\s*(\d+)\s*\/\s*(\d+)\s*$/.exec(v||'');return m?{c:+m[1],t:+m[2]}:null}
function rp(p){return p&&p.t?Math.round(p.c/p.t*1000)/10:null}
function cls(p){return p>=90?'c':p>=70?'g':p>=50?'y':'r'}
function agg(tps,m){var c=0,t=0;tps.forEach(function(tp){tp[KY(m)].forEach(function(v){var p=parse(v);if(p){c+=p.c;t+=p.t}})});return{c:c,t:t,p:t?Math.round(c/t*1000)/10:null}}
function pc(p,tx){return p==null?'<td class="p">—</td>':'<td class="p '+(tx?'tc ':'')+cls(p)+'">'+p+'%</td>'}
function B(id){return S.blocks.filter(function(b){return b.id===id})[0]}
function T(bid,tid){return B(bid).topics.filter(function(t){return t.id===tid})[0]}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2200)}
function tbl(m){
 var k=KY(m),N=NN(m),L=LB(m),i,h='<h2><span class="gl" title="Repasar errores de todo el temario al azar" onclick="revN(\'\',\'\',\''+m+'\')">'+(m==='T'?'📝 Tests':'📄 Pruebas')+'</span></h2><div class="wrap"><table><thead><tr><th class="l">Tema</th><th>% total</th><th>Preguntas</th>';
 for(i=1;i<=N;i++)h+='<th>'+L+' '+i+'<span class="cx" title="Quitar columna (solo si está vacía)" onclick="delCol(\''+m+'\','+(i-1)+')">✕</span></th><th>% '+L+' '+i+'</th>';
 h+='<th class="add"><button onclick="addT(\''+m+'\')" title="Añadir '+L.toLowerCase()+'">＋</button></th></tr></thead><tbody>';
 S.blocks.forEach(function(b){
  var tps=b.topics.filter(function(t){return!(t.h&&t.h[m])});if(b.h&&b.h[m]&&!tps.length)return;var a=agg(tps,m);
  h+='<tr class="blk"><td class="l"><span class="nm" onclick="revAsk(\''+b.id+'\')">📁 '+esc(b.name)+'</span><span class="ic" onclick="addTp(\''+b.id+'\')" title="Añadir tema">＋tema</span><span class="ic" onclick="ren(\''+b.id+'\')">✎</span><span class="ic" onclick="mv(\''+b.id+'\')">⇅</span><span class="ic" onclick="del(\''+b.id+'\',\'\',\''+m+'\')">✕</span></td>'+pc(a.p,1)+'<td>'+(a.t?a.c+'/'+a.t:'')+'</td>';
  for(i=0;i<N;i++)h+='<td></td><td></td>';
  h+='<td></td></tr>';
  b.topics.forEach(function(tp){
   if(tp.h&&tp.h[m])return;var a=agg([tp],m),nq=tp.q.filter(function(q){return (q.m||'T')===m}).length;
   h+='<tr><td class="l"><span class="nm" onclick="revAsk(\''+b.id+'\',\''+tp.id+'\')">'+esc(tp.name)+'</span>'+(nq?' <span class="mu">('+nq+' err.)</span>':'')+'<span class="ic" onclick="ren(\''+b.id+'\',\''+tp.id+'\')">✎</span><span class="ic" onclick="mv(\''+b.id+'\',\''+tp.id+'\')">⇅</span><span class="ic" onclick="del(\''+b.id+'\',\''+tp.id+'\',\''+m+'\')">✕</span></td>'+pc(a.p)+'<td>'+(a.t?a.c+'/'+a.t:'')+'</td>';
   for(i=0;i<N;i++){var v=tp[k][i]||'';h+='<td class="sc" onclick="cell(event,\''+b.id+'\',\''+tp.id+'\',\''+m+'\','+i+')">'+(v?esc(v):'<i>＋</i>')+'</td>'+pc(rp(parse(v)))}
   h+='<td></td></tr>'});
 });
 return h+'</tbody></table></div>';
}
function render(){
 if(!S.blocks.length){$('tb').innerHTML='<div class="wrap"><div class="empty">Hoja vacía. Pulsa «＋ Bloque» para empezar.</div></div>';return}
 $('tb').innerHTML=tbl('T')+tbl('P');
}
/* modal */
function modal(h){$('md').className='';$('md').innerHTML=h;$('ov').style.display='flex'}
function closeM(){$('ov').style.display='none';R=null}
$('ov').addEventListener('mousedown',function(e){if(e.target===this)closeM()});
function ask(title,def,cb){CB=cb;modal('<h3>'+esc(title)+'</h3><input type="text" id="ai" value="'+esc(def)+'"><div class="bt"><button class="pr" onclick="askOk()">Aceptar</button><button onclick="closeM()">Cancelar</button></div>');var i=$('ai');i.focus();i.select();i.onkeydown=function(e){if(e.key==='Enter')askOk()}}
function askOk(){var v=$('ai').value.trim();if(!v)return;var f=CB;closeM();f(v)}
function sure(msg,cb){CB=cb;modal('<h3>¿Seguro?</h3><p>'+esc(msg)+'</p><div class="bt"><button class="pr dg" onclick="var f=CB;closeM();f()">Sí, continuar</button><button onclick="closeM()">Cancelar</button></div>')}
/* estructura */
function addB(){ask('Nombre del bloque','',function(v){snap('addB',{name:v});S.blocks.push({id:uid(),name:v,topics:[]});save();render()})}
function addTp(bid){ask('Nombre del tema','',function(v){snap('addTp',{name:v});var b=B(bid),h=b.h||{};b.topics.push({id:uid(),name:v,s:[],p:[],q:[],h:{T:!!h.T,P:!!h.P}});save();render()})}
function colData(m,i){var k=KY(m),f=false;S.blocks.forEach(function(b){b.topics.forEach(function(tp){if((tp[k][i]||'').trim()||tp.q.some(function(q){return(q.m||'T')===m&&q.t===i}))f=true})});return f}
function delCol(m,i){var nm=LB(m)+' '+(i+1);
 if(NN(m)<=1){toast('Debe quedar al menos una columna');return}
 if(colData(m,i)){modal('<h3>No se puede quitar «'+nm+'»</h3><p>Solo se pueden quitar columnas vacías: esta tiene notas o errores en alguna fila.</p><div class="bt"><button class="pr" onclick="closeM()">Entendido</button></div>');return}
 modal('<h3>Quitar «'+nm+'»</h3><p>La columna está vacía en todas las filas. Aceptando se quitará de '+(m==='T'?'Tests':'Pruebas')+' y las siguientes se renumerarán.</p><div class="bt"><button class="pr dg" onclick="delColOk(\''+m+'\','+i+')">Aceptar</button><button onclick="closeM()">Cancelar</button></div>')}
function delColOk(m,i){var k=KY(m);snap('delCol',{m:m,n:i+1});S.blocks.forEach(function(b){b.topics.forEach(function(tp){if(tp[k].length>i)tp[k].splice(i,1);tp.q.forEach(function(q){if((q.m||'T')===m&&q.t>i)q.t--})})});if(m==='T')S.n--;else S.np--;save();render();closeM();toast('Columna quitada')}
function addT(m){snap('addT',{m:m,n:(m==='T'?S.n:S.np)+1});if(m==='T')S.n++;else S.np++;save();render()}
function ren(bid,tid){var o=tid?T(bid,tid):B(bid);ask('Renombrar',o.name,function(v){snap('ren',{kind:tid?'tema':'bloque',from:o.name,to:v});o.name=v;save();render()})}
function del(bid,tid,m){var nm=tid?T(bid,tid).name:B(bid).name,L=m==='T'?'Tests':'Pruebas',a='\''+bid+'\',\''+(tid||'')+'\',';modal('<h3>Borrar '+esc(nm)+'</h3><p class="mu">¿Dónde? Si lo borras solo de una tabla, en la otra se conservan sus datos.</p><div class="bt"><button class="pr dg" onclick="delW('+a+'\''+m+'\')">Solo en '+L+'</button><button class="dg" onclick="delW('+a+'\'A\')">En ambas</button><button onclick="closeM()">Cancelar</button></div>')}
function delW(bid,tid,sc){
 snap('del',{kind:tid?'tema':'bloque',name:tid?T(bid,tid).name:B(bid).name,sc:sc});var b=B(bid),ms=sc==='A'?['T','P']:[sc];
 function hid(o,m){o.h=o.h||{};o.h[m]=1}
 function clr(tp,m){tp[KY(m)]=[];tp.q=tp.q.filter(function(q){return(q.m||'T')!==m});hid(tp,m)}
 if(tid){var tp=T(bid,tid);ms.forEach(function(m){clr(tp,m)});if(tp.h.T&&tp.h.P)b.topics=b.topics.filter(function(x){return x.id!==tid})}
 else{ms.forEach(function(m){b.topics.forEach(function(tp){clr(tp,m)});hid(b,m)});b.topics=b.topics.filter(function(tp){return!(tp.h.T&&tp.h.P)});if(b.h.T&&b.h.P)S.blocks=S.blocks.filter(function(x){return x.id!==bid})}
 save();render();closeM();
}
function clearAll(){sure('Se borrará toda la hoja y todas las preguntas guardadas en este dispositivo.',function(){snap('clear',cnt());S={n:1,np:1,blocks:[]};save();render()})}
/* mover */
function mv(bid,tid){
 var b=B(bid),h='<h3>Mover '+esc(tid?T(bid,tid).name:b.name)+'</h3><div class="bt"><button onclick="mvs(\''+bid+'\',\''+(tid||'')+'\',-1)">↑ Subir</button><button onclick="mvs(\''+bid+'\',\''+(tid||'')+'\',1)">↓ Bajar</button></div>';
 if(tid){var o=S.blocks.filter(function(x){return x.id!==bid});if(o.length)h+='<p class="mu">Mover a otro bloque:</p><div class="bt">'+o.map(function(x){return'<button onclick="mvb(\''+bid+'\',\''+tid+'\',\''+x.id+'\')">📁 '+esc(x.name)+'</button>'}).join('')+'</div>'}
 modal(h+'<div class="bt"><button class="pr" onclick="closeM()">Listo</button></div>');
}
function mvs(bid,tid,d){var a=tid?B(bid).topics:S.blocks,id=tid||bid,i=a.map(function(x){return x.id}).indexOf(id),j=i+d;if(j<0||j>=a.length)return;snap('mvs',{kind:tid?'tema':'bloque',name:tid?T(bid,tid).name:B(bid).name,d:d});var x=a[i];a[i]=a[j];a[j]=x;save();render();mv(bid,tid)}
function mvb(bid,tid,to){var a=B(bid).topics,i=a.map(function(x){return x.id}).indexOf(tid);snap('mvb',{name:a[i].name,from:B(bid).name,to:B(to).name});B(to).topics.push(a.splice(i,1)[0]);save();render();closeM();toast('Tema movido ✔')}
/* casilla */
function cell(e,bid,tid,m,i){
 var tp=T(bid,tid),k=KY(m),n=tp.q.filter(function(q){return(q.m||'T')===m&&q.t===i}).length,p=$('pop');
 p.innerHTML='<div class="mu">'+LB(m)+' '+(i+1)+' · aciertos/total</div><input type="text" id="sv" placeholder="29/30" value="'+esc(tp[k][i]||'')+'"><button onclick="addQ(\''+bid+'\',\''+tid+'\',\''+m+'\','+i+')">➕ Añadir errores</button><button onclick="rev(\''+bid+'\',\''+tid+'\',\''+m+'\','+i+')">🔁 Repetir errores ('+n+')</button><button onclick="mgOpen(\''+bid+'\',\''+tid+'\',\''+m+'\','+i+')">🗂 Administrar errores ('+n+')</button>';
 p.style.display='block';
 var r=e.currentTarget.getBoundingClientRect();
 p.style.left=Math.max(8,Math.min(r.left,innerWidth-246))+'px';
 p.style.top=Math.min(r.bottom+4,innerHeight-240)+'px';
 var inp=$('sv');inp.focus();
 var cs=null,bef=tp[k][i]||'';inp.oninput=function(){if(!cs){snap('cell',{name:tp.name,lab:LB(m)+' '+(i+1),before:bef,after:''});cs=U[U.length-1]}cs.i.after=inp.value.trim();var s=tp[k].slice();while(s.length<NN(m))s.push('');s[i]=inp.value.trim();tp[k]=s;save();render()};
 inp.onkeydown=function(ev){if(ev.key==='Enter')p.style.display='none'};
}
document.addEventListener('mousedown',function(e){var p=$('pop');if(p.style.display==='block'&&!p.contains(e.target)&&!e.target.closest('td.sc'))p.style.display='none'});
/* añadir errores */
function addQ(bid,tid,m,i){
 $('pop').style.display='none';var tp=T(bid,tid),a='',j;
 for(j=0;j<4;j++)a+='<label class="ar"><input type="radio" name="k" value="'+j+'"'+(j?'':' checked')+'><input type="text" class="an" placeholder="Respuesta '+'ABCD'[j]+'"></label>';
 modal('<h3>Añadir error · '+esc(tp.name)+' · '+LB(m)+' '+(i+1)+'</h3>'+(m==='P'?'<textarea id="qx" style="min-height:110px" placeholder="Texto de la prueba (caso, supuesto…). Se mantiene al añadir otra pregunta."></textarea>':'')+'<textarea id="qq" placeholder="'+(m==='P'?'Titular / enunciado de la pregunta':'Pregunta')+'"></textarea>'+a+'<p class="mu">Marca el círculo de la respuesta correcta.</p><div class="bt"><button class="pr" onclick="saveQ(\''+bid+'\',\''+tid+'\',\''+m+'\','+i+')">Guardar y añadir otra</button><button onclick="closeM()">Cerrar</button></div>');
 (m==='P'?$('qx'):$('qq')).focus();
}
function saveQ(bid,tid,m,i){
 var q=$('qq').value.trim(),an=[].map.call(document.querySelectorAll('.an'),function(x){return x.value.trim()}),k=+document.querySelector('input[name=k]:checked').value;
 if(!q||an.some(function(x){return!x})){toast('Rellena el enunciado y las 4 respuestas');return}
 var o={id:uid(),m:m,t:i,q:q,a:an,k:k};if(m==='P')o.x=$('qx').value.trim();
 snap('addQ',{name:T(bid,tid).name,q:q,lab:LB(m)+' '+(i+1)});T(bid,tid).q.push(o);save();render();
 $('qq').value='';document.querySelectorAll('.an').forEach(function(x){x.value=''});$('qq').focus();toast('Pregunta guardada ✔');

/* repetir errores (siempre aleatorio) */
function revAsk(bid,tid){modal('<h3>Repetir errores · '+esc(tid?T(bid,tid).name:B(bid).name)+'</h3><p class="mu">¿De dónde?</p><div class="bt"><button onclick="revN(\''+bid+'\',\''+(tid||'')+'\',\'T\')">📝 Tests</button><button onclick="revN(\''+bid+'\',\''+(tid||'')+'\',\'P\')">📄 Pruebas</button><button class="pr" onclick="revN(\''+bid+'\',\''+(tid||'')+'\',\'A\')">Ambos</button></div>')}
function tpsOf(bid,tid){return tid?[T(bid,tid)]:bid?B(bid).topics:[].concat.apply([],S.blocks.map(function(b){return b.topics}))}
function pool(bid,tid,m){var tps=tpsOf(bid,tid),n=0;tps.forEach(function(tp){tp.q.forEach(function(q){if(m==='A'||(q.m||'T')===m)n++})});return n}
function revN(bid,tid,m){var tot=pool(bid,tid,m);
 if(!tot){closeM();toast('No hay errores guardados aquí');return}
 var nums=[10,20,30,40,50].filter(function(x){return x<tot});if(nums.length>3)nums=shuf(nums).slice(0,3);
 var op=shuf(nums.concat([0]));
 modal('<h3>¿Cuántas preguntas?</h3><p class="mu">Hay '+tot+' errores guardados'+(bid?'':' de '+(m==='T'?'Tests':m==='P'?'Pruebas':'todo el temario')+' en todo el temario')+'. Se eligen al azar.</p><div class="bt">'+op.map(function(x){return'<button'+(x?'':' class="pr"')+' onclick="rev(\''+bid+'\',\''+tid+'\',\''+m+'\',null,'+x+')">'+(x?x:'Todo ('+tot+')')+'</button>'}).join('')+'</div>')}
function rev(bid,tid,m,i,lim){
 $('pop').style.display='none';
 var tps=tpsOf(bid,tid),qs=[];
 tps.forEach(function(tp){tp.q.forEach(function(q){if((m==='A'||(q.m||'T')===m)&&(i==null||q.t===i))qs.push({q:q,tp:tp})})});
 if(!qs.length){closeM();toast('No hay errores guardados aquí');return}
 R={qs:shuf(qs).slice(0,lim||qs.length),i:0,ok:0,fails:[]};showQ();
}
function showFails(){
 var h='<h3>Errores de este intento ('+R.fails.length+')</h3><div class="mu qh">Las preguntas que no acertaste, con tu respuesta y la correcta.</div>';
 R.fails.forEach(function(f,n){
  var q=f.it.q,a='';
  q.a.forEach(function(t,j){a+='<div class="ans'+(j===q.k?' ok':j===f.ch?' ko':'')+'">'+(j===q.k?'✔ ':j===f.ch?'✘ ':'')+esc(t)+(j===q.k?' <span class="mu">— correcta</span>':j===f.ch?' <span class="mu">— tu respuesta</span>':'')+'</div>'});
  h+='<div class="mq"><div class="mu">'+esc(f.it.tp.name)+' · '+LB(q.m||'T')+' '+(q.t+1)+' · '+(n+1)+'/'+R.fails.length+'</div>'+(q.m==='P'?'<div class="mu ql" style="margin-top:8px">Texto de la prueba</div><div class="tx">'+(q.x?esc(q.x):'<i class="mu">(sin texto)</i>')+'</div>':'')+'<div class="qt">'+esc(q.q)+'</div>'+a+(f.it.dropped?'<div class="mu">Ya la quitaste de tus errores.</div>':'')+'</div>';
 });
 modal(h+'<div class="bt"><button class="pr" onclick="showQ()">← Volver al resultado</button><button onclick="closeM()">Cerrar</button></div>');$('md').className='wd';
}
function showQ(){
 if(R.i>=R.qs.length){modal('<h3>🎉 Repaso terminado</h3><p>Aciertos: <b>'+R.ok+' / '+R.qs.length+'</b></p><div class="bt">'+(R.fails.length?'<button class="pr" onclick="showFails()">👁 Ver errores ('+R.fails.length+')</button>':'')+'<button'+(R.fails.length?'':' class="pr"')+' onclick="closeM()">Cerrar</button></div>');return}
 var it=R.qs[R.i],q=it.q;R.ord=shuf([0,1,2,3]);
 var h='<div class="mu qh">'+esc(it.tp.name)+' · '+LB(q.m||'T')+' '+(q.t+1)+' · '+(R.i+1)+'/'+R.qs.length+'</div>'+((q.m==='P')?'<div class="mu ql">Texto de la prueba</div><div class="tx">'+(q.x?esc(q.x):'<i class="mu">(sin texto)</i>')+'</div><div class="mu ql">Pregunta</div>':'')+'<h3>'+esc(q.q)+'</h3>';
 R.ord.forEach(function(o,n){h+='<button class="op" onclick="ans('+n+')">'+'ABCD'[n]+') '+esc(q.a[o])+'</button>'});
 modal(h+'<div class="bt" id="nx"></div>');$('md').className='wd';
}
function ans(n){
 var it=R.qs[R.i],q=it.q,right=R.ord.indexOf(q.k),b=document.querySelectorAll('.op');
 if(b[0].disabled)return;
 b.forEach(function(x,j){x.disabled=true;if(j===right)x.classList.add('ok');else if(j===n)x.classList.add('ko')});
 if(n===right)R.ok++;else R.fails.push({it:it,ch:R.ord[n]});
 nxBtns();
}
function nxBtns(){$('nx').innerHTML='<button class="pr" onclick="R.i++;showQ()">Siguiente →</button><button onclick="dropAsk()">✔ Ya la domino (quitar)</button>'}
function dropAsk(){$('nx').innerHTML='<span class="mu">¿Quitar esta pregunta de tus errores?</span><button class="pr dg" onclick="drop()">Sí, quitar</button><button onclick="nxBtns()">No</button>'}
function drop(){var it=R.qs[R.i];it.dropped=true;snap('dropQ',{name:it.tp.name,q:it.q.q});it.tp.q=it.tp.q.filter(function(x){return x.id!==it.q.id});save();render();R.i++;showQ()}
/* administrar errores de una casilla */
var MG={};
function mgOpen(bid,tid,m,i){$('pop').style.display='none';MG={bid:bid,tid:tid,m:m,i:i,del:null};mgList()}
function mgQs(){var tp=T(MG.bid,MG.tid);return tp.q.filter(function(q){return(q.m||'T')===MG.m&&q.t===MG.i})}
function mgList(){
 var st=$('md').scrollTop,tp=T(MG.bid,MG.tid),qs=mgQs(),n=qs.length;
 var h='<h3>Administrar errores · '+esc(tp.name)+' · '+LB(MG.m)+' '+(MG.i+1)+'</h3><div class="mu qh">'+n+' pregunta'+(n===1?'':'s')+' guardada'+(n===1?'':'s')+'</div>';
 if(!n)h+='<p class="mu">No hay errores guardados en esta casilla.</p>';
 qs.forEach(function(q,k){
  h+='<div class="mq"><div class="mu">'+(k+1)+'</div>'+(q.x?'<div class="mu">Texto: '+esc(cut(q.x,160))+'</div>':'')+'<div class="qt">'+esc(cut(q.q,260))+'</div><div class="mu">✔ '+'ABCD'[q.k]+') '+esc(cut(q.a[q.k],140))+'</div><div class="bt">'+
  (MG.del===q.id?'<span class="mu">¿Eliminar esta pregunta?</span><button class="pr dg" onclick="mgDelOk(\''+q.id+'\')">Sí, eliminar</button><button onclick="MG.del=null;mgList()">No</button>':'<button onclick="mgEdit(\''+q.id+'\')">✎ Editar</button><button class="dg" onclick="MG.del=\''+q.id+'\';mgList()">🗑 Eliminar</button>')+'</div></div>';
 });
 modal(h+'<div class="bt"><button class="pr" onclick="closeM()">Cerrar</button></div>');$('md').className='wd';$('md').scrollTop=st;
}
function mgEdit(id){
 var tp=T(MG.bid,MG.tid),q=tp.q.filter(function(x){return x.id===id})[0],a='',j;if(!q)return;
 for(j=0;j<4;j++)a+='<label class="ar"><input type="radio" name="k" value="'+j+'"'+(q.k===j?' checked':'')+'><input type="text" class="an" placeholder="Respuesta '+'ABCD'[j]+'" value="'+esc(q.a[j])+'"></label>';
 modal('<h3>Editar error · '+esc(tp.name)+' · '+LB(MG.m)+' '+(MG.i+1)+'</h3>'+(q.m==='P'?'<textarea id="qx" style="min-height:110px" placeholder="Texto de la prueba (caso, supuesto…)">'+esc(q.x||'')+'</textarea>':'')+'<textarea id="qq" placeholder="Pregunta">'+esc(q.q)+'</textarea>'+a+'<p class="mu">Marca el círculo de la respuesta correcta.</p><div class="bt"><button class="pr" onclick="mgSave(\''+id+'\')">Guardar cambios</button><button onclick="mgList()">← Volver a la lista</button></div>');
 $('md').className='wd';$('qq').focus();
}
function mgSave(id){
 var tp=T(MG.bid,MG.tid),q=tp.q.filter(function(x){return x.id===id})[0];if(!q)return;
 var t=$('qq').value.trim(),an=[].map.call(document.querySelectorAll('.an'),function(x){return x.value.trim()}),k=+document.querySelector('input[name=k]:checked').value;
 if(!t||an.some(function(x){return!x})){toast('Rellena el enunciado y las 4 respuestas');return}
 snap('editQ',{name:tp.name,q:q.q});
 q.q=t;q.a=an;q.k=k;if(q.m==='P')q.x=$('qx').value.trim();
 save();render();toast('Cambios guardados ✔');mgList();
}
function mgDelOk(id){
 var tp=T(MG.bid,MG.tid),q=tp.q.filter(function(x){return x.id===id})[0];if(!q)return;
 snap('delQ',{name:tp.name,q:q.q});
 tp.q=tp.q.filter(function(x){return x.id!==id});MG.del=null;
 save();render();toast('Pregunta eliminada');mgList();
}
/* exportar / cargar */
function csvPart(m){
 var k=KY(m),N=NN(m),L=LB(m),i,r=[['Bloque','Tema','% total','Preguntas']];
 for(i=1;i<=N;i++)r[0].push(L+' '+i,'% '+L+' '+i);
 S.blocks.forEach(function(b){b.topics.forEach(function(tp){if(tp.h&&tp.h[m])return;var a=agg([tp],m),row=[b.name,tp.name,a.p==null?'':a.p+'%',a.t?a.c+'/'+a.t:''];for(i=0;i<N;i++){var v=tp[k][i]||'',p=rp(parse(v));row.push(v,p==null?'':p+'%')}r.push(row)})});
 return r;
}
function csvQ(){var r=[['Bloque','Tema','Tipo','Nº','Texto de la prueba','Pregunta','A','B','C','D','Correcta']];S.blocks.forEach(function(b){b.topics.forEach(function(tp){tp.q.forEach(function(q){r.push([b.name,tp.name,LB(q.m||'T'),q.t+1,q.x||'',q.q,q.a[0],q.a[1],q.a[2],q.a[3],'ABCD'[q.k]])})})});return r}
function expCSV(){
 var t='\ufeff'+csvPart('T').concat([[]],csvPart('P'),[[]],csvQ()).map(function(r){return r.map(function(c){c=String(c);return/[;,"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')}).join('\n');
 if(!DL){try{var bl=new Blob([t],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download='oposiciones_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},1000);toast('Guardado ✔')}catch(e){toast('No se pudo guardar')}return}
 DL.save({filename:'oposiciones_'+new Date().toISOString().slice(0,10)+'.csv',data:t}).then(function(){toast('Guardado ✔')}).catch(function(e){if(!e||e.code!=='declined')toast('No se pudo guardar')});
}
function parseCSV(t){var d=/^[^\n]*;/.test(t)?';':',',rows=[],r=[],c='',q=false,i,ch;for(i=0;i<t.length;i++){ch=t[i];if(q){if(ch==='"'&&t[i+1]==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}else if(ch==='"')q=true;else if(ch===d){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';rows.push(r);r=[]}else c+=ch}if(c||r.length){r.push(c);rows.push(r)}return rows.filter(function(x){return x.length>1||x[0]})}
$('fl').onchange=function(){
 var f=this.files[0];this.value='';if(!f)return;var rd=new FileReader();
 rd.onload=function(){
  var t=String(rd.result).replace(/^\ufeff/,''),n;
  try{n=JSON.parse(t);if(!n.blocks)throw 0}catch(e){
   n={n:1,np:1,blocks:[]};var m='T',any=false,seen={};
   parseCSV(t).forEach(function(c){
    if(c[0]==='Bloque'){m=c[2]==='Tipo'?'Q':(c[4]||'').indexOf('Prueba')===0?'P':'T';return}
    any=true;var b=n.blocks.filter(function(x){return x.name===c[0]})[0];if(!b){b={id:uid(),name:c[0],topics:[]};n.blocks.push(b)}
    var tp=b.topics.filter(function(x){return x.name===c[1]})[0];if(!tp){tp={id:uid(),name:c[1],s:[],p:[],q:[]};b.topics.push(tp)}
    if(m==='Q'){tp['_'+(c[2]==='Prueba'?'P':'T')]=1;var kk='ABCD'.indexOf((c[10]||'A').trim().toUpperCase());tp.q.push({id:uid(),m:c[2]==='Prueba'?'P':'T',t:Math.max(0,(+c[3]||1)-1),x:c[4]||'',q:c[5]||'',a:[c[6]||'',c[7]||'',c[8]||'',c[9]||''],k:kk<0?0:kk});return}var s=[];for(var i=4;i<c.length;i+=2)s.push(c[i]||'');tp[KY(m)]=s;tp['_'+m]=1;seen[m]=1;
    if(m==='T')n.n=Math.max(n.n,s.length);else n.np=Math.max(n.np,s.length)});
   if(!any){toast('Archivo no válido');return}n.blocks.forEach(function(b){b.h={};b.topics.forEach(function(tp){tp.h={};['T','P'].forEach(function(x){if(seen[x]&&!tp['_'+x])tp.h[x]=1});delete tp._T;delete tp._P});['T','P'].forEach(function(x){if(b.topics.length&&b.topics.every(function(tp){return tp.h[x]}))b.h[x]=1})});
  }
  sure('Se reemplazará la hoja actual por el archivo cargado.',function(){snap('load',cnt());S=n;norm();save();render()});
 };rd.readAsText(f);
};
var U=[];
function cut(s,n){s=String(s||'');return s.length>n?s.slice(0,n)+'…':s}
function cnt(){var t=0;S.blocks.forEach(function(b){t+=b.topics.length});return{b:S.blocks.length,t:t}}
function snap(ty,info){U.push({ty:ty,s:JSON.stringify(S),i:info});if(U.length>30)U.shift();updU()}
function updU(){var b=$('un');b.style.opacity=U.length?1:.5;b.textContent='↩ Deshacer'+(U.length?' ('+U.length+')':'')}
function umsg(e){
 var i=e.i,ty=e.ty,q=function(s,n){return '«'+cut(s,n||50)+'»'};
 if(ty==='addB')return 'Aceptando eliminarás el bloque que creaste: '+q(i.name)+'.';
 if(ty==='addTp')return 'Aceptando eliminarás el tema que creaste: '+q(i.name)+' (en Tests y Pruebas).';
 if(ty==='addT')return 'Aceptando quitarás la columna '+q(LB(i.m)+' '+i.n)+' que añadiste en '+(i.m==='T'?'Tests':'Pruebas')+'.';
 if(ty==='ren')return 'Aceptando el '+i.kind+' volverá a llamarse '+q(i.from)+' (ahora se llama '+q(i.to)+').';
 if(ty==='del'){var w=i.sc==='A'?'en ambas tablas':'solo en '+(i.sc==='T'?'Tests':'Pruebas');return 'Aceptando reaparecerá el '+i.kind+' que borraste: '+q(i.name)+' ('+w+'), '+(i.kind==='bloque'?'con todos sus temas, ':'')+'con sus notas y errores.'}
 if(ty==='mvs')return 'Aceptando el '+i.kind+' '+q(i.name)+' volverá a su posición anterior ('+(i.d<0?'bajará':'subirá')+' un puesto).';
 if(ty==='mvb')return 'Aceptando el tema '+q(i.name)+' volverá al bloque '+q(i.from)+' (ahora está en '+q(i.to)+').';
 if(ty==='cell')return 'Aceptando la casilla '+q(i.lab)+' del tema '+q(i.name)+' '+(i.before?'volverá a poner '+q(i.before):'quedará vacía')+(i.after?' (ahora pone '+q(i.after)+').':' (ahora está vacía).');
 if(ty==='addQ')return 'Aceptando eliminarás la pregunta que añadiste: '+q(i.q,70)+' (tema '+q(i.name)+', '+i.lab+').';
 if(ty==='editQ')return 'Aceptando la pregunta '+q(i.q,70)+' (tema '+q(i.name)+') volverá a su versión anterior a la edición.';
 if(ty==='delQ')return 'Aceptando reaparecerá la pregunta que eliminaste: '+q(i.q,70)+' (tema '+q(i.name)+').';
 if(ty==='dropQ')return 'Aceptando reaparecerá la pregunta que quitaste de tus errores: '+q(i.q,70)+' (tema '+q(i.name)+').';
 if(ty==='clear')return 'Aceptando recuperarás la hoja que borraste: '+i.b+' bloques y '+i.t+' temas, con sus notas y errores.';
 if(ty==='load')return 'Aceptando volverá la hoja que tenías antes de cargar el archivo ('+(i.b?i.b+' bloques y '+i.t+' temas':'estaba vacía')+'). Se descartará lo que cargaste.';
 if(ty==='delCol')return 'Aceptando reaparecerá la columna '+q(LB(i.m)+' '+i.n)+' (vacía) en '+(i.m==='T'?'Tests':'Pruebas')+'.';
 return 'Aceptando se deshará la última acción.';
}
